name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests & Soak Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Validate Scenario Data
        working-directory: ./backend
        run: go run ./cmd/scenario-check ../data/scenarios/riverside-factory

      - name: Run Go Vet
        working-directory: ./backend
        run: go vet ./...

      - name: Run Go Unit Tests
        working-directory: ./backend
        run: go test -v ./...

      - name: Run Fast Soak Test (10 Seeds)
        working-directory: ./backend
        run: go run ./cmd/soak-test -runs 10 -workers 4

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Next.js Production Build
        working-directory: ./frontend
        run: npm run build


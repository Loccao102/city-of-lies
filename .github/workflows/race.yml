name: Race Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-race:
    name: Go Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: backend/go.sum

      - name: Run Go Race Tests
        working-directory: ./backend
        run: go test -race -v ./...

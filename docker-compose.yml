services:
  postgres:
    image: postgres:18-alpine
    container_name: cityoflies-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cityoflies}
      POSTGRES_USER: ${POSTGRES_USER:-cityoflies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cityoflies_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cityoflies} -d ${POSTGRES_DB:-cityoflies}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cityoflies-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CITYOFLIES_HTTP_ADDR: ":8080"
      CITYOFLIES_DATABASE_URL: "postgres://${POSTGRES_USER:-cityoflies}:${POSTGRES_PASSWORD:-cityoflies_dev_only}@postgres:5432/${POSTGRES_DB:-cityoflies}?sslmode=disable"
      CITYOFLIES_SCENARIO_DIR: "/app/data/scenarios"
      CITYOFLIES_LLM_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cityoflies-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080/api/v1"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8080/ws"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
